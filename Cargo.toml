[package]
name = "rs_database_connect"
version = "0.0.1"
edition = "2021"
description = "Synchronous PHP extension for Oracle and PostgreSQL (RsDataBaseConnect)"
license = "MIT"
readme = "README.md"
rust-version = "1.75"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["postgres", "oracle"]
postgres = ["dep:postgres", "dep:postgres-openssl", "dep:openssl", "dep:native-tls"]
oracle = ["dep:oracle"]

[dependencies]
ext-php-rs = "0.15"
once_cell = "1.19"
parking_lot = "0.12"
sha2 = "0.10"
hex = "0.4"
urlencoding = "2.1"
thiserror = "2.0"

postgres = { version = "0.19", optional = true }
postgres-openssl = { version = "0.5", optional = true }
openssl = { version = "0.10", optional = true }
native-tls = { version = "0.2", optional = true }
oracle = { version = "0.6", optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(php_zts)', 'cfg(php80)', 'cfg(php81)', 'cfg(php82)', 'cfg(php83)', 'cfg(php84)', 'cfg(php85)'] }
