name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-unit:
    name: Rust unit (postgres)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: none
          coverage: none
      - name: Build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config clang libclang-dev
      - name: Unit tests
        run: |
          export PHP_CONFIG="$(command -v php-config)"
          echo "PHP_CONFIG=$PHP_CONFIG"
          "$PHP_CONFIG" --version
          cargo test --lib --features postgres

  rust-unit-oracle-compile:
    name: Compile with oracle feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: none
          coverage: none
      - name: Build postgres+oracle
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config clang libclang-dev
          export PHP_CONFIG="$(command -v php-config)"
          echo "PHP_CONFIG=$PHP_CONFIG"
          cargo build --features postgres,oracle

  php-matrix:
    name: ${{ matrix.os }} PHP ${{ matrix.php }} ${{ matrix.ts }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        php: ["8.2", "8.3", "8.4", "8.5"]
        ts: [nts, zts]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'Windows'

      - uses: dtolnay/rust-toolchain@nightly
        if: runner.os == 'Windows'
        with:
          targets: x86_64-pc-windows-msvc

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
          coverage: none
        env:
          phpts: ${{ matrix.ts }}

      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config clang libclang-dev

      - name: Install build deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3 pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Install OpenSSL (Windows / vcpkg)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          VCPKG_ROOT="${VCPKG_INSTALLATION_ROOT:-C:/vcpkg}"
          if [[ ! -d "$VCPKG_ROOT" ]]; then
            git clone --depth 1 https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
            "$VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          fi
          "$VCPKG_ROOT/vcpkg.exe" install openssl:x64-windows
          OPENSSL_ROOT="$(cygpath -u "$VCPKG_ROOT/installed/x64-windows")"
          echo "OPENSSL_DIR=$OPENSSL_ROOT" >> "$GITHUB_ENV"
          echo "OPENSSL_LIB_DIR=$OPENSSL_ROOT/lib" >> "$GITHUB_ENV"
          echo "OPENSSL_INCLUDE_DIR=$OPENSSL_ROOT/include" >> "$GITHUB_ENV"

      - name: Build and load extension
        shell: bash
        run: |
          set -euo pipefail
          php -v
          php -i | grep -i 'Thread Safety' || true

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            # Do NOT set PHP from `command -v` (Git Bash path without .exe).
            # ext-php-rs then fails: "php executable not found at C:/tools/php/php".
            # Leave PHP unset so find_php() uses `where php` → php.exe.
            unset PHP PHP_CONFIG || true
            export RUSTUP_TOOLCHAIN=nightly
            export RUSTFLAGS="-C linker=rust-lld"
            where php
            cargo +nightly build --release --features postgres
            EXT="target/release/rs_database_connect.dll"
            # php.exe needs a Windows path, not /d/a/...
            DIR="$(pwd -W)"
          else
            export PHP_CONFIG="$(command -v php-config)"
            echo "PHP_CONFIG=$PHP_CONFIG"
            "$PHP_CONFIG" --version
            cargo build --release --features postgres
            case "$(uname -s)" in
              Linux)  EXT="target/release/librs_database_connect.so" ;;
              Darwin) EXT="target/release/librs_database_connect.dylib" ;;
            esac
            DIR="$PWD"
          fi

          test -f "$EXT"
          php -d "extension=${DIR}/${EXT}" -r \
            'exit(extension_loaded("rs_database_connect") && class_exists("RsDataBaseConnect") && ini_get("rs_database_connect.lob_max_bytes") !== false ? 0 : 1);'

  integration-pg:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rsdb
          POSTGRES_PASSWORD: rsdb
          POSTGRES_DB: rsdb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rsdb -d rsdb_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: none
          coverage: none
      - name: Build and smoke
        env:
          RSDB_DSN: "pg://rsdb:rsdb@127.0.0.1:5432/rsdb_test"
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config clang libclang-dev
          export PHP_CONFIG="$(command -v php-config)"
          echo "PHP_CONFIG=$PHP_CONFIG"
          cargo build --features postgres
          php -d extension="$PWD/target/debug/librs_database_connect.so" tests/smoke_pg.php
