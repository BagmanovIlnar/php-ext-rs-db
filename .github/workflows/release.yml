name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-unix:
    name: ${{ matrix.os }} PHP ${{ matrix.php }} ${{ matrix.ts }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        php: ["8.2", "8.3", "8.4", "8.5"]
        ts: [nts, zts]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
          coverage: none
        env:
          phpts: ${{ matrix.ts }}

      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config clang libclang-dev

      - name: Install build deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3 pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Build and pack
        shell: bash
        run: |
          set -euo pipefail
          export PHP_CONFIG="$(command -v php-config)"
          "$PHP_CONFIG" --version
          php -i | grep -i 'Thread Safety' || true
          cargo build --release --features postgres

          case "${{ matrix.os }}" in
            ubuntu-*) OS_ID=linux ;;
            macos-*)  OS_ID=macos ;;
          esac
          ARCH="$(uname -m)"
          PHP_VER="${{ matrix.php }}"
          TS="${{ matrix.ts }}"
          VER="${GITHUB_REF_NAME#v}"

          case "$(uname -s)" in
            Linux)  SRC="target/release/librs_database_connect.so";  EXT="so" ;;
            Darwin) SRC="target/release/librs_database_connect.dylib"; EXT="dylib" ;;
          esac
          test -f "$SRC"
          php -d "extension=$PWD/$SRC" -r \
            'exit(extension_loaded("rs_database_connect") && class_exists("RsDataBaseConnect") ? 0 : 1);'

          STAGE="dist/rs_database_connect"
          rm -rf dist && mkdir -p "$STAGE"
          cp "$SRC" "$STAGE/rs_database_connect.${EXT}"
          cp stubs/rs_database_connect.stub.php "$STAGE/"
          printf '%s\n' \
            'extension=rs_database_connect' \
            'zend.exception_ignore_args=On' \
            'rs_database_connect.max_connections_per_process=2' \
            'rs_database_connect.pool_wait_timeout_ms=30000' \
            'rs_database_connect.idle_validate_ms=60000' \
            'rs_database_connect.session_reset=1' \
            'rs_database_connect.lob_max_bytes=16777216' \
            'rs_database_connect.stmt_cache_size=20' \
            > "$STAGE/rs_database_connect.ini"
          cat > "$STAGE/INSTALL.txt" <<EOF
          rs_database_connect ${VER}
          Platform: ${OS_ID} ${ARCH}
          PHP: ${PHP_VER} ${TS}
          Features: postgres

          1. Copy rs_database_connect.${EXT} into \$(php-config --extension-dir)
          2. Enable: extension=rs_database_connect
          3. Restart SAPI; php -m | grep rs_database_connect
          EOF
          python3 -c "from pathlib import Path; p=Path('dist/rs_database_connect/INSTALL.txt'); p.write_text('\n'.join(l.lstrip() for l in p.read_text().splitlines())+'\n')"

          ARCHIVE="rs_database_connect-${VER}-${OS_ID}-${ARCH}-php${PHP_VER}-${TS}-postgres.tar.gz"
          tar -C dist -czf "$ARCHIVE" rs_database_connect
          shasum -a 256 "$ARCHIVE" | tee "${ARCHIVE}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: rsdb-${{ matrix.os }}-php${{ matrix.php }}-${{ matrix.ts }}
          path: |
            rs_database_connect-*.tar.gz
            rs_database_connect-*.tar.gz.sha256

  build-windows:
    name: windows PHP ${{ matrix.php }} ${{ matrix.ts }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
        ts: [nts, zts]
    steps:
      - uses: actions/checkout@v4

      # ext-php-rs needs nightly on Windows (vectorcall ABI).
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-pc-windows-msvc

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
          coverage: none
        env:
          phpts: ${{ matrix.ts }}

      - name: Install OpenSSL (vcpkg)
        shell: bash
        run: |
          set -euo pipefail
          VCPKG_ROOT="${VCPKG_INSTALLATION_ROOT:-C:/vcpkg}"
          if [[ ! -d "$VCPKG_ROOT" ]]; then
            git clone --depth 1 https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
            "$VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          fi
          "$VCPKG_ROOT/vcpkg.exe" install openssl:x64-windows
          OPENSSL_ROOT="$(cygpath -u "$VCPKG_ROOT/installed/x64-windows")"
          echo "OPENSSL_DIR=$OPENSSL_ROOT" >> "$GITHUB_ENV"
          echo "OPENSSL_LIB_DIR=$OPENSSL_ROOT/lib" >> "$GITHUB_ENV"
          echo "OPENSSL_INCLUDE_DIR=$OPENSSL_ROOT/include" >> "$GITHUB_ENV"
          echo "VCPKG_ROOT=$VCPKG_ROOT" >> "$GITHUB_ENV"

      - name: Build and pack
        shell: bash
        run: |
          set -euo pipefail
          export PHP_CONFIG="$(command -v php-config)"
          echo "PHP_CONFIG=$PHP_CONFIG"
          "$PHP_CONFIG" --version
          php -i | grep -i 'Thread Safety' || true
          # rust-lld is configured in .cargo/config.toml for windows-msvc
          cargo +nightly build --release --features postgres

          SRC="target/release/rs_database_connect.dll"
          test -f "$SRC"
          php -d "extension=$PWD/$SRC" -r \
            'exit(extension_loaded("rs_database_connect") && class_exists("RsDataBaseConnect") ? 0 : 1);'

          VER="${GITHUB_REF_NAME#v}"
          PHP_VER="${{ matrix.php }}"
          TS="${{ matrix.ts }}"
          ARCH="x86_64"
          STAGE="dist/rs_database_connect"
          rm -rf dist && mkdir -p "$STAGE"
          cp "$SRC" "$STAGE/php_rs_database_connect.dll"
          cp "$SRC" "$STAGE/rs_database_connect.dll"
          cp stubs/rs_database_connect.stub.php "$STAGE/"
          printf '%s\n' \
            'extension=rs_database_connect' \
            'zend.exception_ignore_args=On' \
            'rs_database_connect.max_connections_per_process=2' \
            'rs_database_connect.pool_wait_timeout_ms=30000' \
            'rs_database_connect.idle_validate_ms=60000' \
            'rs_database_connect.session_reset=1' \
            'rs_database_connect.lob_max_bytes=16777216' \
            'rs_database_connect.stmt_cache_size=20' \
            > "$STAGE/php.ini.snippet"
          cat > "$STAGE/INSTALL.txt" <<EOF
          rs_database_connect ${VER}
          Platform: windows ${ARCH}
          PHP: ${PHP_VER} ${TS}
          Features: postgres

          1. Copy rs_database_connect.dll into the PHP extension_dir
             (see php --ini / extension_dir)
          2. In php.ini add: extension=rs_database_connect
          3. Restart PHP / IIS / php-cgi
          4. php -m | findstr rs_database_connect
          EOF
          python -c "from pathlib import Path; p=Path(r'dist/rs_database_connect/INSTALL.txt'); p.write_text('\n'.join(l.lstrip() for l in p.read_text().splitlines())+'\n')"

          ARCHIVE="rs_database_connect-${VER}-windows-${ARCH}-php${PHP_VER}-${TS}-postgres.zip"
          (
            cd dist
            7z a -tzip "../${ARCHIVE}" rs_database_connect
          )
          sha256sum "$ARCHIVE" | tee "${ARCHIVE}.sha256"
          ls -la "$ARCHIVE" "${ARCHIVE}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: rsdb-windows-php${{ matrix.php }}-${{ matrix.ts }}
          path: |
            rs_database_connect-*.zip
            rs_database_connect-*.zip.sha256

  publish:
    name: GitHub Release
    needs: [build-unix, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List assets
        run: find artifacts -type f | sort

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## rs_database_connect `${{ github.ref_name }}`

            Prebuilt **NTS** and **ZTS** binaries (**PostgreSQL**).

            | Platform | Archive |
            | --- | --- |
            | Linux | `*-linux-*-phpX.Y-{nts\|zts}-postgres.tar.gz` |
            | macOS | `*-macos-*-phpX.Y-{nts\|zts}-postgres.tar.gz` |
            | Windows | `*-windows-x86_64-phpX.Y-{nts\|zts}-postgres.zip` |

            Match **PHP version**, **architecture**, and **NTS/ZTS** to your runtime (`php -i | grep Thread`).

            Each package contains the extension binary (`.so` / `.dylib` / `.dll`), ini snippet, stub, and `INSTALL.txt`.

            Oracle builds are not in this matrix yet.
          files: |
            artifacts/rs_database_connect-*.tar.gz
            artifacts/rs_database_connect-*.tar.gz.sha256
            artifacts/rs_database_connect-*.zip
            artifacts/rs_database_connect-*.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
